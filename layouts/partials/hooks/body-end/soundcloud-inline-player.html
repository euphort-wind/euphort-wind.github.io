{{/* Inline SoundCloud playback for Music portfolio cards. */}}
<script>
(function () {
  const section = document.getElementById('music');
  if (!section || section.dataset.soundcloudPlayerReady === 'true') return;
  section.dataset.soundcloudPlayerReady = 'true';

  const playerWrap = document.createElement('div');
  playerWrap.className = 'soundcloud-inline-player';
  playerWrap.style.cssText = 'margin: 1.5rem 0; width: 100%;';
  playerWrap.setAttribute('aria-label', 'SoundCloud music player');

  const playerTitle = document.createElement('p');
  playerTitle.className = 'soundcloud-inline-player__title';
  playerTitle.textContent = 'Select a track above to play';
  playerTitle.style.cssText = 'margin: 0 0 .5rem; font-weight: 600;';

  const frame = document.createElement('iframe');
  frame.title = 'SoundCloud audio player';
  frame.width = '100%';
  frame.height = '166';
  frame.allow = 'autoplay';
  frame.setAttribute('scrolling', 'no');
  frame.style.cssText = 'border: 0; display: block; width: 100%;';
  playerWrap.append(playerTitle, frame);

  // Place the player after the portfolio cards so the existing card layout stays intact.
  section.appendChild(playerWrap);

  let widget = null;
  let widgetReady = false;
  let activeTrack = '';
  let pendingTrack = '';

  function playerOptions(autoPlay) {
    return {
      auto_play: autoPlay,
      hide_related: true,
      show_comments: false,
      show_user: true,
      show_reposts: false,
      visual: false
    };
  }

  function loadTrack(url) {
    if (!frame.src || frame.src === 'about:blank') {
      frame.src = 'https://w.soundcloud.com/player/?url=' +
        encodeURIComponent(url) + '&auto_play=true&hide_related=true&show_comments=false&show_user=true&show_reposts=false&visual=false';
      activeTrack = url;
      return;
    }
    if (!widgetReady || !widget) {
      pendingTrack = url;
      return;
    }
    if (url === activeTrack) {
      widget.toggle();
      return;
    }
    activeTrack = url;
    playerTitle.textContent = 'Loading track…';
    widget.load(url, playerOptions(true));
  }

  function loadWidgetApi() {
    if (window.SC && window.SC.Widget) {
      initializeWidget();
      return;
    }
    if (document.querySelector('script[data-soundcloud-widget-api]')) return;
    const api = document.createElement('script');
    api.src = 'https://w.soundcloud.com/player/api.js';
    api.async = true;
    api.dataset.soundcloudWidgetApi = 'true';
    api.onload = initializeWidget;
    document.head.appendChild(api);
  }

  function initializeWidget() {
    if (widget || !frame.src || !window.SC || !window.SC.Widget) return;
    widget = window.SC.Widget(frame);
    widget.bind(window.SC.Widget.Events.READY, function () {
      widgetReady = true;
      if (pendingTrack && pendingTrack !== activeTrack) {
        const nextTrack = pendingTrack;
        pendingTrack = '';
        loadTrack(nextTrack);
      }
    });
    widget.bind(window.SC.Widget.Events.PLAY, function () {
      playerTitle.textContent = 'Now playing';
    });
    widget.bind(window.SC.Widget.Events.PAUSE, function () {
      playerTitle.textContent = 'Playback paused';
    });
  }

  section.addEventListener('click', function (event) {
    const link = event.target.closest('a[href]');
    if (!link || !section.contains(link)) return;
    let parsed;
    try { parsed = new URL(link.href, window.location.href); } catch (_) { return; }
    if (!/(^|\.)soundcloud\.com$/i.test(parsed.hostname)) return;

    event.preventDefault();
    event.stopPropagation();
    const trackUrl = parsed.origin + parsed.pathname.replace(/\/$/, '');
    loadTrack(trackUrl);
    loadWidgetApi();
    if (playerWrap.parentNode) playerWrap.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  });
})();
</script>
