</script>

      emoji: "🚹",
      image: "/images/bedoin.svg",
      className: "minori"
    }
  ];

  const ignored = new Set([
    "SCRIPT", "STYLE", "NOSCRIPT",
    "TEXTAREA", "INPUT", "CODE", "PRE"
  ]);

  function replaceEmojis(root) {
    REPLACERS.forEach(({ emoji, image, className }) => {
      const walker = document.createTreeWalker(
        root,
        NodeFilter.SHOW_TEXT,
        {
          acceptNode(node) {
            if (!node.nodeValue.includes(emoji)) {
              return NodeFilter.FILTER_REJECT;
            }

            let parent = node.parentElement;

            while (parent && parent !== root.parentElement) {
              if (ignored.has(parent.tagName)) {
                return NodeFilter.FILTER_REJECT;
              }

              parent = parent.parentElement;
            }

            return NodeFilter.FILTER_ACCEPT;
          }
        }
      );

      const nodes = [];

      while (walker.nextNode()) {
        nodes.push(walker.currentNode);
      }

      nodes.forEach(node => {
        const parts = node.nodeValue.split(emoji);

        if (parts.length < 2) return;

        const fragment = document.createDocumentFragment();

        parts.forEach((part, index) => {
          fragment.appendChild(document.createTextNode(part));

          if (index < parts.length - 1) {
            const img = document.createElement("img");

            img.src = image;
            img.alt = "";
            img.className = className;

            img.style.cssText = `
              display: inline-block;
              height: ${className === "minori" ? "0.8em" : "1em"};
              width: ${className === "minori" ? "0.8em" : "auto"};
              max-width: none;
              object-fit: contain;
              vertical-align: -0.12em;
              margin: 0 0.05em;
            `;

            img.setAttribute("aria-hidden", "true");

            fragment.appendChild(img);
          }
        });

        node.replaceWith(fragment);
      });
    });
  }

  function initialize() {
    replaceEmojis(document.body);

    const observer = new MutationObserver(mutations => {
      mutations.forEach(mutation => {
        mutation.addedNodes.forEach(node => {
          if (node.nodeType === Node.TEXT_NODE) {
            const parent = node.parentElement;

            if (parent) replaceEmojis(parent);
          } else if (node.nodeType === Node.ELEMENT_NODE) {
            replaceEmojis(node);
          }
        });
      });
    });

    observer.observe(document.body, {
      childList: true,
      subtree: true
    });
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", initialize);
  } else {
    initialize();
  }
})();
